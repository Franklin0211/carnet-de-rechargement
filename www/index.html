<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1417">
<title>Carnet de rechargement</title>
<style>
:root{
  --bg:#0E1417; --surf:#151E23; --surf2:#1C272D; --line:#2B3940;
  --brass:#C9972F; --copper:#B5723A; --text:#E4E9EB; --mute:#8797A0; --red:#CF5A45; --green:#6FA98B;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;overscroll-behavior:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top));background:var(--surf);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:16px;font-weight:600}
header .sub{font-size:11px;color:var(--mute);font-family:var(--mono);margin-top:2px}
main{flex:1;overflow-y:auto;padding:12px 16px 96px;-webkit-overflow-scrolling:touch}
nav{display:flex;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 0;background:none;border:none;border-top:2px solid transparent;
  color:var(--mute);font-size:12.5px;font-family:var(--sans)}
nav button.on{color:var(--brass);font-weight:600;border-top-color:var(--brass)}

button,select,input,textarea{font-family:var(--sans);font-size:15px}
a{color:var(--brass)}
.btn{border-radius:10px;padding:11px 16px;background:none;border:1px solid var(--line);color:var(--text);font-weight:500;display:inline-block;text-align:center;text-decoration:none}
.btn.p{background:var(--brass);border-color:var(--brass);color:#0E1417;font-weight:600}
.btn.d{border-color:var(--red);color:var(--red)}
.btn.s{padding:7px 12px;font-size:13px}
.btn.full{width:100%}

label.lb{display:block;margin-bottom:4px;font-size:12px;color:var(--mute)}
.fld{display:flex;align-items:center;background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.fld input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);padding:11px 0}
.fld input.mono{font-family:var(--mono)}
.fld .sfx{padding-left:8px;color:var(--mute);font-family:var(--mono);font-size:13px}
select.sel{width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;color:var(--text);outline:none;appearance:none}
select.sel option{background:var(--surf2);color:var(--text)}
textarea{width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:10px;
  padding:12px;color:var(--text);outline:none;resize:vertical;font-size:14px;font-family:var(--sans)}

.row{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.row3{display:grid;gap:12px;grid-template-columns:1fr 1fr 1fr}
.mt{margin-top:12px}
.rule{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
.rule span{color:var(--brass);font-size:13px;font-weight:600}
.rule i{flex:1;height:1px;background:var(--line)}

.card{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);
  border-radius:12px;padding:13px;margin-bottom:8px;color:var(--text)}
.card .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .t b{font-size:15px;font-weight:600}
.card .t em{font-style:normal;font-size:12px;color:var(--mute);font-family:var(--mono);white-space:nowrap}
.card .sub{margin-top:3px;font-size:12.5px;color:var(--mute);line-height:1.5}
.card .data{margin-top:8px;font-family:var(--mono);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 18px}
.card .data k{color:var(--mute)}
.card .warn{margin-top:8px;font-size:11.5px;color:var(--red)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:10px;padding:9px 12px;background:none;border:1px solid var(--line);
  color:var(--text);font-family:var(--mono);font-size:13px;font-weight:600}
.chip.on{background:var(--brass);border-color:var(--brass);color:#0E1417}
.chip.txt{font-family:var(--sans);font-size:12.5px;font-weight:400;color:var(--mute)}
.chip.txt.on{background:var(--copper);border-color:var(--copper);color:#0E1417;font-weight:600}
.chip.sel{background:var(--brass);border-color:var(--brass);color:#0E1417;font-weight:600}
.chip.done{background:var(--green);border-color:var(--green);color:#0E1417;font-weight:600}

.list{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.list div.it{display:flex;justify-content:space-between;align-items:center;
  background:var(--surf);padding:11px 14px;font-size:13.5px;border-top:1px solid var(--line)}
.list div.it:first-child{border-top:none}
.list .tag{color:var(--brass);font-size:11px}
.list .x{background:none;border:none;color:var(--mute);font-size:20px;line-height:1;padding:0 4px}

.empty{margin-top:60px;text-align:center;color:var(--mute);font-size:14px;line-height:1.8}
.menu{position:absolute;right:16px;top:64px;z-index:30;width:250px;background:var(--surf2);
  border:1px solid var(--line);border-radius:10px;padding:6px}
.menu button,.menu a.mi{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);
  padding:11px 12px;font-size:14px;border-radius:6px;text-decoration:none;box-sizing:border-box}

.step{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.step.done{border-color:var(--copper)}
.step .sh{display:flex;align-items:center;gap:10px}
.step .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surf2);border:1px solid var(--line);
  color:var(--mute);font-family:var(--mono);font-size:12px;display:flex;align-items:center;justify-content:center}
.step.done .num{background:var(--copper);border-color:var(--copper);color:#0E1417}
.step .ti{flex:1}
.step .ti b{display:block;font-size:14.5px}
.step .ti span{display:block;font-size:11.5px;color:var(--mute);margin-top:1px}
.step .body{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

.jauge{height:9px;border-radius:5px;background:var(--surf2);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.jauge i{display:block;height:100%}
.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600}
.badge.u{background:#243038;color:var(--text)}
.badge.h{background:var(--brass);color:#0E1417}
.alerte{margin-top:12px;padding:11px 13px;border-radius:10px;background:#2A1714;
  border:1px solid var(--red);color:var(--red);font-size:12.5px;line-height:1.5}
.avert{margin-top:12px;padding:11px 13px;border-radius:10px;background:#221B0E;
  border:1px solid #7A5E20;color:var(--brass);font-size:12.5px;line-height:1.5}
.pont{margin-top:14px;padding:14px;border-radius:12px;background:var(--surf);border:1px solid var(--copper)}
.pont p{margin:0 0 10px;font-size:12.5px;color:var(--mute);line-height:1.6}
.readout{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.readout .row3{margin-top:0}
.readout .big{font-family:var(--mono);font-size:30px;color:var(--brass);line-height:1}
.readout .lab{font-size:11px;color:var(--mute);margin-top:4px}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.scroll-x button{white-space:nowrap}
.foot{display:flex;gap:12px;margin:24px 0 16px}
.lien{background:none;border:none;color:var(--brass);font-size:11.5px;text-decoration:underline;padding:0 0 0 4px}
</style>

</head>

const G_PAR_GR=0.06479891;                       // 1 grain = 0,06479891 g
const enGr=(v,u)=>!v||isNaN(+v)?null:(u==="g"?(+v)/G_PAR_GR:+v);
const deGr=(v,u)=>v==null?"":(u==="g"?v*G_PAR_GR:v);
const convCharge=(v,de,vers)=>{const g=enGr(v,de);return g==null?"":deGr(g,vers).toFixed(vers==="g"?3:2)};

/* ---- écran séances ---- */
function progres(s){const n=ETAPES.filter(e=>s.etapes[e.k]&&s.etapes[e.k].fait).length;return{n,total:ETAPES.length,pct:Math.round(n/ETAPES.length*100)}}

function ecranSessions(){
  const cals=[...new Set(db.sessions.map(s=>s.calibre).filter(Boolean))].sort();
  const sessions=db.sessions.filter(s=>!ui.fCalibre||s.calibre===ui.fCalibre)
    .sort((a,b)=>(b.date||"").localeCompare(a.date||"")||b.id.localeCompare(a.id));
  return `<button class="btn p full" data-a="newSession">Nouvelle séance de rechargement</button>
  ${db.sessions.length?`<div class="mt">${sel("fCalibre",ui.fCalibre,cals,"Tous les calibres")}</div>`:""}
  ${sessions.length?`<div class="mt">${sessions.map(cardSession).join("")}</div>`
   :`<div class="empty">Rien d'enregistré pour l'instant.<br>Crée un lot d'étuis,<br>puis démarre ta première séance.</div>`}`;
}
function cardSession(s){
  const p=progres(s),lot=db.lots.find(l=>l.id===s.lotEtuiId);
  const r=s.resultats||{};
  const tauxRebut=(+r.quantiteProduite)?Math.round((+r.rebuts||0)/(+r.quantiteProduite)*100):null;
  const couleur=p.n>=ETAPES.length?"var(--green)":p.n>0?"var(--brass)":"var(--line)";
  return `<button class="card" data-a="openSession" data-v="${s.id}">
    <div class="t"><b>${esc(s.nom||"séance sans nom")}</b><em style="color:var(--brass)">${esc(s.calibre||"")}</em></div>
    <div class="sub">${esc([s.date,lot&&lot.nom].filter(Boolean).join(" · ")||"date non renseignée")}</div>
    <div class="jauge"><i style="width:${p.pct}%;background:${couleur}"></i></div>
    <div class="data" style="margin-top:6px">
      <span>${p.n}/${p.total} étapes</span>
      ${r.quantiteProduite?`<span><k>produites </k><b style="color:var(--brass)">${esc(r.quantiteProduite)}</b></span>`:""}
      ${r.rebuts?`<span><k>rebuts </k>${esc(r.rebuts)}${tauxRebut!=null?" ("+tauxRebut+"%)":""}</span>`:""}</div></button>`;
}

function stepChamp(k,label,inner){return `<div class="mt">${lb(label,inner)}</div>`}

function stepSection(s,e){
  const d=s.etapes[e.k]||{fait:false,note:""};
  const fait=!!d.fait;
  let champs="";
  if(e.k==="nettoyage"){
    champs=stepChamp("etapes.nettoyage.methode","Méthode",sel("etapes.nettoyage.methode",d.methode,METHODES_NETTOYAGE,"Choisir une méthode"));
  }else if(e.k==="redimensionnement"){
    champs=stepChamp("etapes.redimensionnement.type","Type",sel("etapes.redimensionnement.type",d.type,TYPES_RESIZE,"Choisir un type"))+
      `<div class="mt">${lb("Lubrifiant",fld("etapes.redimensionnement.lubrifiant",{v:d.lubrifiant,ph:"ex. Imperial Sizing Wax"}))}</div>`;
  }else if(e.k==="controleCotes"){
    const cote=s.calibre&&COTES[s.calibre]?COTES[s.calibre]:null;
    champs=`<div class="row3">
      <div>${lb("Longueur mesurée",fld("etapes.controleCotes.longueur",{v:d.longueur,im:"decimal",mono:1,sfx:"mm"}))}</div>
      <div>${lb("Rognée à",fld("etapes.controleCotes.trim",{v:d.trim,im:"decimal",mono:1,sfx:"mm"}))}</div>
      <div style="display:flex;align-items:flex-end;padding-bottom:11px">
        <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute)">
          <input type="checkbox" data-a="chk" data-v="etapes.controleCotes.chanfrein" ${d.chanfrein?"checked":""}> chanfreiné</label></div></div>
      ${cote?`<div style="margin-top:6px;font-size:11.5px;color:var(--mute)">Cote nominale pour ${esc(s.calibre)} : longueur après rognage ${cote[0]||"—"} mm, COL maxi ${cote[1]} mm.</div>`:""}`;
  }else if(e.k==="amorcage"){
    champs=stepChamp("etapes.amorcage.amorce","Amorce",sel("etapes.amorcage.amorce",d.amorce,L.amorces(),"Choisir une amorce"));
  }else if(e.k==="poudre"){
    const u=d.chargeU||uniteDef();
    champs=stepChamp("etapes.poudre.poudre","Poudre",sel("etapes.poudre.poudre",d.poudre,L.poudres(),"Choisir une poudre"))+
    `<div class="row mt">
      <div>${lb("Charge",fld("etapes.poudre.charge",{v:d.charge,im:"decimal",mono:1,sfx:u==="g"?"g":"gr",ph:"0.0"}))}</div>
      <div>${lb("Lot de poudre",fld("etapes.poudre.lotPoudre",{v:d.lotPoudre,mono:1}))}</div></div>
    <div class="chips" style="margin-top:8px">
      <button class="chip ${u==="g"?"":"sel"}" data-a="chargeUnit" data-v="gr">grains</button>
      <button class="chip ${u==="g"?"sel":""}" data-a="chargeUnit" data-v="g">grammes</button>
      ${d.charge?`<span style="align-self:center;font-family:var(--mono);font-size:12px;color:var(--mute)">= ${
        u==="g"?convCharge(d.charge,"g","gr")+" gr":convCharge(d.charge,"gr","g")+" g"}</span>`:""}</div>
    <div class="row mt">
      <div>${lb("Pesée mini échantillon",fld("etapes.poudre.pMin",{v:d.pMin,im:"decimal",mono:1,sfx:u==="g"?"g":"gr"}))}</div>
      <div>${lb("Pesée maxi échantillon",fld("etapes.poudre.pMax",{v:d.pMax,im:"decimal",mono:1,sfx:u==="g"?"g":"gr"}))}</div></div>`;
  }else if(e.k==="ogive"){
    champs=stepChamp("etapes.ogive.projectile","Ogive",sel("etapes.ogive.projectile",d.projectile,L.projectiles(),"Choisir une ogive"))+
    `<div class="row3 mt">
      <div>${lb("COL",fld("etapes.ogive.col",{v:d.col,im:"decimal",mono:1,sfx:"mm"}))}</div>
      <div>${lb("CBTO",fld("etapes.ogive.cbto",{v:d.cbto,im:"decimal",mono:1,sfx:"mm"}))}</div>
      <div>${lb("Assise",fld("etapes.ogive.assise",{v:d.assise,im:"decimal",mono:1,sfx:"mm"}))}</div></div>`;
  }else if(e.k==="sertissage"){
    champs=stepChamp("etapes.sertissage.type","Type",sel("etapes.sertissage.type",d.type,TYPES_SERTISSAGE,"Choisir un type"));
  }else if(e.k==="controleFinal"){
    const u=d.poidsCartoucheU||uniteDef();
    champs=`<div class="row mt">
      <div>${lb("Poids cartouche complète",fld("etapes.controleFinal.poidsCartouche",{v:d.poidsCartouche,im:"decimal",mono:1,sfx:u==="g"?"g":"gr"}))}</div>

      <div class="mt">${lb("Note",fld("etapes."+e.k+".note",{v:d.note,ph:"remarque sur cette étape…"}))}</div></div></div>`;

  const historique=db.sessions.filter(s=>s.lotEtuiId===l.id).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  return `<div style="display:flex;justify-content:space-between;margin-bottom:14px">
    <button class="btn s" data-a="close">Retour</button><button class="btn s p" data-a="saveLot">Enregistrer</button></div>
  ${rule("Identité du lot")}
  ${lb("Nom",fld("nom",{v:l.nom,ph:"ex. Lapua 6,5 CM lot A"}))}
  <div class="row mt">
    <div>${lb("Marque",sel("marque",l.marque,L.etuis(),"Choisir une marque"))}</div>
    <div>${lb("Calibre",sel("calibre",l.calibre,L.calibres(),"Choisir un calibre"))}</div></div>
  <div class="row mt">
    <div>${lb("Quantité d'étuis",fld("quantite",{v:l.quantite,im:"numeric",mono:1}))}</div>
    <div>${lb("Date d'acquisition",fld("date",{v:l.date,type:"date",mono:1}))}</div></div>
  <div class="chips mt">
    <button class="chip txt ${l.neuf?"sel":""}" data-a="lotNeuf" data-v="1">Étuis neufs à l'origine</button>
    <button class="chip txt ${!l.neuf?"sel":""}" data-a="lotNeuf" data-v="0">Récupération</button></div>

  ${rule("Nombre de rechargements")}
  <div class="jauge"><i style="width:${pct}%;background:${couleur}"></i></div>
  <div style="margin-top:6px;font-family:var(--mono);font-size:13px;color:var(--mute)">${nb} / ${MAX_RECHARGES}</div>
  <div class="chips mt">
    <button class="chip" data-a="lotPlus" data-v="1">+1 rechargement</button>
    <button class="chip" data-a="lotPlus" data-v="-1">−1</button>
    <button class="chip txt" data-a="lotPlus" data-v="reset">Remise à zéro</button></div>
  ${nb>=MAX_RECHARGES?`<div class="alerte">Limite de ${MAX_RECHARGES} rechargements atteinte. Mets ce lot au rebut.</div>`
   :nb>=25?`<div class="avert">Au-delà de 25 rechargements, contrôle la tenue du collet et cherche un début de fluage au culot avant chaque nouvelle passe.</div>`:""}

  <div class="row mt">
    <div>${lb("Recuits effectués",fld("recuits",{v:l.recuits,im:"numeric",mono:1}))}</div>
    <div>${lb("Tension au collet",fld("tension",{v:l.tension,im:"decimal",mono:1,sfx:"mm"}))}</div></div>

  ${rule("Notes")}
  <textarea data-f="notes" rows="3" placeholder="Provenance, état, tri effectué…">${esc(l.notes)}</textarea>

  ${historique.length?rule("Séances utilisant ce lot")+`<div class="list">${historique.map(s=>{
    const p=progres(s);
    return `<div class="it"><span>${esc(s.date||"—")} · ${esc(s.nom||"sans nom")}</span><span class="tag">${p.n}/${p.total}</span></div>`}).join("")}</div>`:""}

  <div class="foot"><button class="btn p full" data-a="saveLot">Enregistrer</button>
    ${l._exist?'<button class="btn d" data-a="delLot">Supprimer</button>':""}</div>`;
}

/* ---- composants ---- */
function ecranComposants(){
  const libs={poudres:"Poudres",amorces:"Amorces",etuis:"Étuis",projectiles:"Ogives",calibres:"Calibres"};
  const all=L[ui.baseCat](),items=all.filter(x=>x.toLowerCase().includes(ui.baseQ.toLowerCase()));
  const perso=db.perso[ui.baseCat]||[];
  return `<div class="scroll-x">${Object.keys(libs).map(k=>
    `<button class="chip txt ${ui.baseCat===k?"on":""}" style="${ui.baseCat===k?"background:var(--brass);border-color:var(--brass);color:#0E1417":""}"
      data-a="baseCat" data-v="${k}">${libs[k]}</button>`).join("")}</div>
  <div class="mt">${fld("baseQ",{v:ui.baseQ,ph:"Chercher parmi "+all.length+" références"})}</div>
  <div class="mt" style="display:flex;gap:8px">
    <div style="flex:1">${fld("_new",{v:"",ph:"Ajouter une référence absente"})}</div>
    <button class="btn" data-a="addRef">Ajouter</button></div>
  <div class="list">${items.slice(0,500).map(x=>`<div class="it"><span>${esc(x)}${perso.includes(x)?' <span class="tag">· ajoutée</span>':""}</span>
    ${perso.includes(x)?`<button class="x" data-a="delRef" data-v="${esc(x)}">×</button>`:""}</div>`).join("")
    ||`<div class="it" style="justify-content:center;color:var(--mute)">Aucune correspondance. Ajoute-la ci-dessus.</div>`}</div>
  ${items.length>500?`<div style="margin-top:8px;text-align:center;color:var(--mute);font-size:12px">${items.length} résultats, 500 affichés.</div>`:""}`;
}

/* ---- résultats ---- */
function ecranResultats(){
  const withRes=db.sessions.filter(s=>s.resultats&&(s.resultats.quantiteProduite||s.resultats.rebuts));
  const totProd=withRes.reduce((a,s)=>a+(+s.resultats.quantiteProduite||0),0);
  const totRebut=withRes.reduce((a,s)=>a+(+s.resultats.rebuts||0),0);
  const taux=totProd?Math.round(totRebut/totProd*100):null;
  const sessions=[...db.sessions].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  return `<div class="pont">
    <p>Fais le lien avec tes séries de tir : les munitions mises au point ici se retrouvent dans <b>Carnet de tir</b> une fois copiées depuis la fiche de séance.</p>
    <a class="btn full" href="${LIEN_TIR}" target="_blank" rel="noopener">Ouvrir Carnet de tir ↗</a></div>
  ${rule("Bilan global")}
  <div class="readout"><div class="row3">
    <div><div class="big">${totProd}</div><div class="lab">cartouches produites</div></div>
    <div><div class="big">${totRebut}</div><div class="lab">rebuts</div></div>
    <div><div class="big">${taux==null?"—":taux+" %"}</div><div class="lab">taux de rebut</div></div></div></div>
  ${rule("Détail par séance")}
  ${sessions.length?`<div class="list">${sessions.map(s=>{
    const r=s.resultats||{},p=progres(s);
    return `<div class="it" style="cursor:pointer" data-a="openSession" data-v="${s.id}">
      <span>${esc(s.date||"—")} · ${esc(s.nom||"sans nom")}<br><span class="tag">${esc(s.calibre||"")} · ${p.n}/${p.total} étapes</span></span>
      <span style="text-align:right">${r.quantiteProduite?esc(r.quantiteProduite)+" prod.":""}${r.rebuts?" · "+esc(r.rebuts)+" rebuts":""}</span></div>`}).join("")}</div>`
   :`<div class="empty">Aucune séance enregistrée pour l'instant.</div>`}`;
}

/* =================== ÉVÉNEMENTS =================== */
document.addEventListener("input",e=>{
  const k=e.target.dataset.f;if(!k)return;
  const v=e.target.value;
  if(k==="baseQ"){ui.baseQ=v;const m=document.querySelector(".list");
    const all=L[ui.baseCat](),items=all.filter(x=>x.toLowerCase().includes(v.toLowerCase())),perso=db.perso[ui.baseCat]||[];
    if(m)m.innerHTML=items.slice(0,500).map(x=>`<div class="it"><span>${esc(x)}${perso.includes(x)?' <span class="tag">· ajoutée</span>':""}</span>
      ${perso.includes(x)?`<button class="x" data-a="delRef" data-v="${esc(x)}">×</button>`:""}</div>`).join("")
      ||`<div class="it" style="justify-content:center;color:var(--mute)">Aucune correspondance. Ajoute-la ci-dessus.</div>`;
    return}
  if(k==="fCalibre"){ui.fCalibre=v;render();return}
  if(k.startsWith("_"))return;
  if(!draft)return;
  setP(draft,k,v);
  if(k==="calibre"&&draftKind==="session"){render();return}
  if(k==="lotEtuiId"){const l=db.lots.find(x=>x.id===v);if(l&&!draft.calibre)draft.calibre=l.calibre;render();return}
});

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");
  if(!b){if(ui.menu){ui.menu=false;render()}return}
  const a=b.dataset.a,v=b.dataset.v;
  const pull=()=>{document.querySelectorAll("[data-f]").forEach(el=>{
    const k=el.dataset.f;if(k&&!k.startsWith("_")&&draft)setP(draft,k,el.value)})};

  switch(a){
    case "menu":ui.menu=!ui.menu;break;
    case "tab":ui.tab=v;ui.menu=false;break;
    case "close":ui.route=null;draft=null;draftKind=null;break;
    case "baseCat":ui.baseCat=v;ui.baseQ="";break;

    case "newSession":draft={id:uid(),date:new Date().toISOString().slice(0,10),nom:"",calibre:"",lotEtuiId:"",
      etapes:vierge(),resultats:{quantiteProduite:"",rebuts:"",causes:[],poidsMoyen:"",observations:""},notes:""};
      draftKind="session";ui.route={t:"session"};break;
    case "openSession":draft={...db.sessions.find(x=>x.id===v)};draft.etapes={...vierge(),...(draft.etapes||{})};
      draft.resultats={quantiteProduite:"",rebuts:"",causes:[],poidsMoyen:"",observations:"",...(draft.resultats||{})};
      draft._exist=1;draftKind="session";ui.route={t:"session"};break;
    case "openLotFrom":pull();{const s={...draft};db.sessions=s._exist?db.sessions.map(x=>x.id===s.id?s:x):db.sessions;save();}
      draft={...db.lots.find(x=>x.id===v),_exist:1};draftKind="lot";ui.route={t:"lot"};break;
    case "toggleEtape":pull();draft.etapes[v]=draft.etapes[v]||{fait:false,note:""};draft.etapes[v].fait=!draft.etapes[v].fait;break;
    case "chargeUnit":{pull();const d=draft.etapes.poudre,de=d.chargeU||uniteDef();
      if(de!==v){if(d.charge)d.charge=convCharge(d.charge,de,v);d.chargeU=v;db.uniteCharge=v;save()}break}
    case "poidsUnit":{pull();const d=draft.etapes.controleFinal,de=d.poidsCartoucheU||uniteDef();
      if(de!==v){if(d.poidsCartouche)d.poidsCartouche=convCharge(d.poidsCartouche,de,v);d.poidsCartoucheU=v;break}break}
    case "chk":pull();setP(draft,v,!getP(draft,v));break;
    case "causeRebut":pull();draft.resultats.causes=(draft.resultats.causes||[]).includes(v)
      ?draft.resultats.causes.filter(x=>x!==v):[...(draft.resultats.causes||[]),v];break;
    case "saveSession":{pull();const s={...draft};delete s._exist;
      db.sessions=draft._exist?db.sessions.map(x=>x.id===s.id?s:x):[...db.sessions,s];save();ui.route=null;draft=null;draftKind=null;break}
    case "delSession":if(confirm("Supprimer cette séance ?")){db.sessions=db.sessions.filter(x=>x.id!==draft.id);save();ui.route=null;draft=null;draftKind=null}break;
    case "copierPourTir":{pull();copierPourCarnetTir(draft);break}

    case "newLot":draft={id:uid(),date:new Date().toISOString().slice(0,10),nom:"",marque:"",calibre:"",quantite:"",
      neuf:true,nbRecharges:"",recuits:"",tension:"",notes:""};draftKind="lot";ui.route={t:"lot"};break;
    case "openLot":draft={...db.lots.find(x=>x.id===v),_exist:1};draftKind="lot";ui.route={t:"lot"};break;
    case "lotNeuf":pull();draft.neuf=(v==="1");break;
    case "lotPlus":{pull();
      if(v==="reset"){draft.nbRecharges="";break}
      const n=Math.max(0,Math.min(MAX_RECHARGES,(+draft.nbRecharges||0)+(+v)));draft.nbRecharges=String(n);break}
    case "saveLot":{pull();const l={...draft};delete l._exist;if(!l.nom)l.nom=(l.marque||"Lot")+" "+(l.calibre||"");
      db.lots=draft._exist?db.lots.map(x=>x.id===l.id?l:x):[...db.lots,l];save();ui.route=null;draft=null;draftKind=null;break}
    case "delLot":if(confirm("Supprimer ce lot ?")){db.lots=db.lots.filter(x=>x.id!==draft.id);save();ui.route=null;draft=null;draftKind=null}break;

    case "addRef":{const el=document.querySelector('[data-f="_new"]');const n=(el?el.value:"").trim();
      if(n){db.perso[ui.baseCat]=[...(db.perso[ui.baseCat]||[]),n];save()}break}
    case "delRef":db.perso[ui.baseCat]=db.perso[ui.baseCat].filter(x=>x!==v);save();break;

    case "expJson":dl(JSON.stringify(db,null,2),"carnet-de-rechargement-"+today()+".json","application/json");ui.menu=false;break;
    case "expCsv":{const head=["date","nom","calibre","lot_etui","poudre","charge","unite","charge_en_grains","amorce","projectile","col_mm","produites","rebuts","poids_moyen","observations"];
      const rows=db.sessions.map(s=>{const l=db.lots.find(x=>x.id===s.lotEtuiId),po=s.etapes.poudre||{},og=s.etapes.ogive||{},am=s.etapes.amorcage||{},r=s.resultats||{};
        return [s.date,s.nom||"",s.calibre||"",l?.nom||"",po.poudre||"",po.charge||"",po.chargeU==="g"?"g":"gr",
          (enGr(po.charge,po.chargeU)||"")&&enGr(po.charge,po.chargeU).toFixed(2),am.amorce||"",og.projectile||"",og.col||"",
          r.quantiteProduite||"",r.rebuts||"",r.poidsMoyen||"",(r.observations||"").replace(/[\n;]/g," ")].join(";")});
      dl([head.join(";"),...rows].join("\n"),"seances-"+today()+".csv","text/csv");ui.menu=false;break}
    case "imp":{const i=document.createElement("input");i.type="file";i.accept=".json";
      i.onchange=()=>{const fl=i.files[0];if(!fl)return;const rd=new FileReader();
        rd.onload=()=>{try{const d=JSON.parse(rd.result);db={...EMPTY,...d,perso:{...EMPTY.perso,...(d.perso||{})}};
          save();render()}catch(x){alert("Fichier illisible : ce n'est pas un export du carnet.")}};
        rd.readAsText(fl)};i.click();ui.menu=false;break}
    case "backup":ui.menu=false;ui.route={t:"backup",texte:JSON.stringify(db,null,1),nom:"carnet"};break;
    case "copier":copierTexte(document.getElementById("bk"));return;
    case "restaurer":{const t=document.getElementById("rs");
      if(!t||!t.value.trim()){alert("Colle d'abord une sauvegarde dans le second cadre.");return}
      try{const d=JSON.parse(t.value);db={...EMPTY,...d,perso:{...EMPTY.perso,...(d.perso||{})}};save();
        ui.route=null;alert("Carnet restauré.")}
      catch(e){alert("Texte illisible : ce n'est pas une sauvegarde valide.");return}
      break}
    default:return;
  }
  render();
});

function copierPourCarnetTir(s){
  const l=db.lots.find(x=>x.id===s.lotEtuiId)||{};
  const po=s.etapes.poudre||{},og=s.etapes.ogive||{},am=s.etapes.amorcage||{},se=s.etapes.sertissage||{};
  const recette={
    id:"rech-"+uid(),type:"recharge",nom:s.nom||"",calibre:s.calibre||"",
    projectile:og.projectile||"",poidsOgive:"",longOgive:"",diam:"",
    poudre:po.poudre||"",chargeRef:po.charge||"",chargeRefU:po.chargeU||"gr",lotPoudre:po.lotPoudre||"",
    etui:l.marque||"",etuiNeuf:l.neuf!==false,etuiTirs:String(l.nbRecharges||""),longEtui:"",colMax:"",
    volume:"",recuits:l.recuits||"",tension:l.tension||"",
    amorce:am.amorce||"",marqueMun:"",refMun:"",v0Annoncee:"",lot:"",prix:"",parBoite:"",
    col:og.col||"",cbto:og.cbto||"",saut:"",assise:og.assise||"",sertissage:se.type||"",
    notes:(s.resultats&&s.resultats.observations)||""
  };
  const texte=JSON.stringify(recette,null,2);
  const ok=()=>alert("Munition copiée. Colle-la dans Carnet de tir : menu Données → Importer une recette (coller JSON).");
  const secours=()=>{ui.route={t:"backup",texte,nom:"recette-"+(s.nom||"sans-nom")};render()};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(texte).then(ok,secours)}
    else secours();
  }catch(e){secours()}
}
function copierTexte(t){
  if(!t)return;
  t.select();t.setSelectionRange(0,999999);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t.value).then(()=>alert("Copié."),()=>{
      try{document.execCommand("copy");alert("Copié.")}catch(e){alert("Copie impossible : sélectionne le texte à la main.")}});
  }else{
    try{document.execCommand("copy");alert("Copié.")}catch(e){alert("Copie impossible : sélectionne le texte à la main.")}
  }
}

const today=()=>new Date().toISOString().slice(0,10);
async function dl(txt,name,mime){
  const cap=window.Capacitor&&window.Capacitor.Plugins;
  if(window.Capacitor){
    if(cap&&cap.Filesystem){
      // Android verrouille certains dossiers selon la version : on essaie plusieurs emplacements
      const lieux=[["DOCUMENTS","Documents"],["EXTERNAL_STORAGE","stockage interne"],
                   ["EXTERNAL","stockage de l'app"],["DATA","données de l'app"],["CACHE","cache de l'app"]];
      let res=null, ou="";
      for(const [dir,nom] of lieux){
        try{
          res=await cap.Filesystem.writeFile({path:name,data:txt,directory:dir,encoding:"utf8",recursive:true});
          ou=nom; break;
        }catch(e){ /* emplacement refusé : on tente le suivant */ }
      }
      if(res){
        if(cap.Share){
          try{
            await cap.Share.share({title:name,text:"Sauvegarde du carnet de rechargement",url:res.uri,
              dialogTitle:"Envoyer la sauvegarde"});
            return;
          }catch(e){ /* partage annulé : le fichier reste écrit */ }
        }
        alert("Fichier enregistré dans "+ou+" :\n"+name);
        return;
      }
      alert("Aucun emplacement d'écriture autorisé par Android.\nJe bascule sur la sauvegarde par copier-coller.");
    }
    ui.route={t:"backup",texte:txt,nom:name}; render(); return;
  }
  let ok=false;
  try{
    const b=new Blob([txt],{type:mime}),u=URL.createObjectURL(b),a=document.createElement("a");
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),2000);
    ok=true;
  }catch(e){}
  setTimeout(()=>{ if(!ui.route){ ui.route={t:"backup",texte:txt,nom:name}; render(); } },600);
}

function ecranBackup(){
  return `<div style="display:flex;justify-content:space-between;margin-bottom:14px">
    <button class="btn s" data-a="close">Retour</button>
    <button class="btn s p" data-a="copier">Copier</button></div>
  ${rule("Sauvegarde par copier-coller")}
  <div style="font-size:12.5px;color:var(--mute);line-height:1.6;margin-bottom:10px">
    Copie ce texte et colle-le dans un mail, une note, un fichier — ou dans Carnet de tir si c'est une recette.</div>
  <textarea id="bk" rows="10" style="font-family:var(--mono);font-size:11px">${esc(ui.route.texte||JSON.stringify(db))}</textarea>
  ${rule("Restaurer")}
  <div style="font-size:12.5px;color:var(--mute);line-height:1.6;margin-bottom:10px">
    Colle ici une sauvegarde complète du carnet de rechargement, puis valide. Le carnet actuel sera remplacé.</div>
  <textarea id="rs" rows="6" placeholder="Colle ici le contenu d'une sauvegarde" style="font-family:var(--mono);font-size:11px"></textarea>
  <div class="foot"><button class="btn d full" data-a="restaurer">Remplacer le carnet par ce texte</button></div>`;
}

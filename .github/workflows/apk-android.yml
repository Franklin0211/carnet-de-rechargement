name: APK Android

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer les dépendances
        run: npm install

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Synchroniser le contenu web
        run: npx cap sync android

      - name: Installer l'icône et l'écran de lancement
        run: |
          pip install --quiet pillow
          python3 - << 'PYEOF'
          from PIL import Image
          import os
          res = 'android/app/src/main/res'
          dens = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
          for d, (leg, fg) in dens.items():
              folder = f'{res}/mipmap-{d}'
              os.makedirs(folder, exist_ok=True)
              Image.open('resources/icon-legacy.png').convert('RGBA').resize((leg, leg), Image.LANCZOS).save(f'{folder}/ic_launcher.png')
              Image.open('resources/icon-round.png').convert('RGBA').resize((leg, leg), Image.LANCZOS).save(f'{folder}/ic_launcher_round.png')
              Image.open('resources/icon-foreground.png').convert('RGBA').resize((fg, fg), Image.LANCZOS).save(f'{folder}/ic_launcher_foreground.png')
          with open(f'{res}/values/ic_launcher_background.xml', 'w') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0F171B</color>\n</resources>\n')
          print('icônes installées')
          PYEOF
          sed -i 's#@drawable/splash#@color/ic_launcher_background#' android/app/src/main/res/values/styles.xml || true

      - name: Numéroter la version
        run: |
          python3 - << 'PYEOF'
          import json, re
          with open('package.json') as f:
              version = json.load(f)['version']
          run_number = "${{ github.run_number }}"
          path = 'android/app/build.gradle'
          with open(path) as f:
              content = f.read()
          content = re.sub(r'versionCode\s+\d+', f'versionCode {run_number}', content, count=1)
          content = re.sub(r'versionName\s+"[^"]*"', f'versionName "{version}"', content, count=1)
          with open(path, 'w') as f:
              f.write(content)
          print(f"versionCode={run_number} versionName={version}")
          PYEOF

      - name: Construire l'APK (non signé)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Préparer la clé de signature
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > signing.keystore

      - name: Aligner et signer l'APK
        run: |
          set -e
          UNSIGNED=$(find android/app/build/outputs/apk/release -name "*unsigned*.apk" | head -n1)
          echo "APK non signé : $UNSIGNED"
          BUILD_TOOLS_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools"
          BUILD_TOOLS=$(ls "$BUILD_TOOLS_DIR" | sort -V | tail -n1)
          ZIPALIGN="$BUILD_TOOLS_DIR/$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/$BUILD_TOOLS/apksigner"
          echo "Outils de build : $BUILD_TOOLS"
          "$ZIPALIGN" -v -p 4 "$UNSIGNED" aligned.apk
          "$APKSIGNER" sign \
            --ks signing.keystore \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --out carnet-de-rechargement.apk \
            aligned.apk
          "$APKSIGNER" verify carnet-de-rechargement.apk
          rm -f signing.keystore

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: carnet-de-rechargement-apk
          path: carnet-de-rechargement.apk
          retention-days: 5
